[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-long-horizon-agent"
version = "0.1.0"
description = "A reliable, resumable computer-use agent runtime"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
desktop = ["pyautogui>=0.9.54"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
